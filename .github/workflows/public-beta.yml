name: Public Tracevity GitHub-effect acceptance

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number that will receive three bounded demo comments
        required: true
        default: "1"

run-name: Tracevity public acceptance by @${{ github.actor }}

permissions:
  contents: read
  issues: write

concurrency:
  group: tracevity-public-effect-${{ github.repository }}
  cancel-in-progress: false

jobs:
  public-black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out only the public demonstration repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install only public pinned packages
        run: |
          python -m pip install --disable-pip-version-check tracevity==0.5.2
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run capture, real effects, provider reads, Inspect, reports, and Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run_reference.sh work/reference "${{ inputs.issue_number }}"

      - name: Upload the complete public demonstration record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tracevity-github-effect-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/reference
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

